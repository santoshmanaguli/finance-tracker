# All environment-specific values come from env vars (12-factor app, factor III).
# The same JAR runs locally, in Docker, and on AWS; only the environment changes.
# Defaults after ':' are for local development ONLY and match docker-compose.yml.

spring:
  application:
    name: finance-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}
    hikari:
      maximum-pool-size: 5        # single user; Postgres connections are not free

  jpa:
    open-in-view: false           # see README: keeps DB access inside the service layer
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful              # finish in-flight requests on SIGTERM (Docker stop, deploys)

management:
  endpoints:
    web:
      exposure:
        include: health,info      # expose the minimum; metrics come in Phase 8
  endpoint:
    health:
      show-details: never         # don't leak DB info to the internet
      probes:
        enabled: true             # /actuator/health/liveness and /readiness

finance:
  # Phase 2: shared secret for POST /api/ingest/sms. No default on purpose:
  # if it is missing in production the ingest endpoint must refuse everything.
  ingest-token: ${INGEST_API_TOKEN:}
  # Cross-source dedup (layer 3): an SMS and an email for the same card swipe
  # are considered the same transaction if their times are within this window.
  dedup-window-minutes: 15
