# Local development stack: Postgres 16 + the app.
# Values come from .env (copy .env.example to .env); Compose reads it automatically.

services:
  postgres:
    image: postgres:16-alpine          # same image as the Testcontainers tests
    environment:
      POSTGRES_DB: ${DB_NAME:-finance}
      POSTGRES_USER: ${DB_USERNAME:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"          # bind to localhost only, never 0.0.0.0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy     # "started" is not "ready to accept connections"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-finance}   # service name = DNS name
      DB_USERNAME: ${DB_USERNAME:-finance}
      DB_PASSWORD: ${DB_PASSWORD}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:                              # survives `docker compose down`; deleted by `down -v`
